name: Mood Badge Rotate

on:
  schedule:
    - cron: '0 12 * * *' # Update siang UTC
  workflow_dispatch:

jobs:
  rotate-mood:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Rotate Mood
        run: |
          node scripts/rotateMood.js

      - name: Commit Mood Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: daily mood badge update" || echo "No changes to commit"
          git push
